<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ground-N1 — demo wall</title>
<link rel="stylesheet" href="n1.css">
<style>
 body{margin:0;height:100vh;overflow:hidden;display:grid;grid-template-rows:auto 1fr}
 .bar{display:flex;align-items:center;gap:14px;padding:7px 14px;border-bottom:1px solid var(--line);background:#08121c;font-size:12px}
 .bar b{letter-spacing:.14em}.bar a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px}.bar a:hover{color:var(--teal);border-color:var(--teal)}
 .bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
 .wall{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;min-height:0}
 .cell{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#050b12;min-height:0;min-width:0}
 .cell.live{grid-row:1/3}
 .cell iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#050b12}
 .cell .label{position:absolute;right:10px;bottom:8px;z-index:2;font-size:10px;letter-spacing:.16em;color:var(--muted);background:rgba(5,11,18,.7);padding:2px 8px;border-radius:99px;pointer-events:none}
@media (max-aspect-ratio:1/1){.wall{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}.cell.live{grid-row:auto}}
</style><link rel="stylesheet" href="site-nav.css"></head>
<body class="n1-body">
<div class="bar"><b>GROUND-N1 · DEMO WALL</b><span class="muted">Live window, pilot screen and ground control on one display.</span><span class="sp"><a href="n1.html">Launcher / controls</a><a href="n1-pilot.html" target="_blank">Pilot ↗</a><a href="n1-ground.html" target="_blank">Ground ↗</a><a href="n1-live.html" target="_blank">Live ↗</a></span></div>
<div class="wall" id="wall">
  <div class="cell live" data-w="1500" data-h="900"><iframe src="n1-live.html" title="Live 3D window"></iframe><span class="label">LIVE</span></div>
  <div class="cell" data-w="1500" data-h="880"><iframe src="n1-pilot.html" title="Pilot screen"></iframe><span class="label">PILOT · VH-101</span></div>
  <div class="cell" data-w="1500" data-h="900"><iframe src="n1-ground.html" title="Ground control"></iframe><span class="label">GROUND CONTROL</span></div>
</div>
<script>
 // Each screen keeps its native design size; the wall scales it to fit its tile.
 function fit(){for(const c of document.querySelectorAll('.cell')){const f=c.querySelector('iframe'),w=+c.dataset.w,h=+c.dataset.h,s=Math.min(c.clientWidth/w,c.clientHeight/h);f.style.width=w+'px';f.style.height=h+'px';f.style.transform=`scale(${s})`;f.style.left=(c.clientWidth-w*s)/2+'px';f.style.top=(c.clientHeight-h*s)/2+'px';}}
 addEventListener('resize',fit);fit();
</script>
<script src="site-nav.js"></script></body></html>
