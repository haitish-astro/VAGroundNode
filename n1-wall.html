<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo wall · Vahnim Ground-N1</title>
<meta name="description" content="The Vahnim Ground-N1 live view, pilot screen and ground control on one display.">
<link rel="stylesheet" href="n1.css"><link rel="stylesheet" href="site-nav.css">
<style>
 body{margin:0;height:100vh;overflow:hidden}
 .wall{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;height:100%;min-height:0}
 .cell{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#0a0c10;min-height:0;min-width:0}
 .cell.live{grid-row:1/3}
 .cell iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#0a0c10}
 .cell .label{position:absolute;right:10px;bottom:8px;z-index:2;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:rgba(10,12,16,.72);padding:2px 8px;border-radius:99px;pointer-events:none}
 body.film{padding-top:0!important}body.film .wall{padding:0;gap:0}body.film .cell{border-radius:0;border-width:0}body.film .label{display:none}
 @media (max-aspect-ratio:1/1){.wall{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}.cell.live{grid-row:auto}}
</style></head>
<body class="n1-body">
<main id="main" class="wall">
  <div class="cell live" data-w="1500" data-h="900"><iframe src="n1-live.html" title="Live 3D view"></iframe><span class="label">Live view</span></div>
  <div class="cell" data-w="1500" data-h="880"><iframe src="n1-pilot.html" title="Pilot screen"></iframe><span class="label">Pilot</span></div>
  <div class="cell" data-w="1500" data-h="900"><iframe src="n1-ground.html" title="Ground control"></iframe><span class="label">Ground control</span></div>
</main>
<script src="n1-link.js"></script>
<script>
 // Each screen keeps its native design size; the wall scales it to fit its tile.
 function fit(){for(const c of document.querySelectorAll('.cell')){const f=c.querySelector('iframe'),w=+c.dataset.w,h=+c.dataset.h,s=Math.min(c.clientWidth/w,c.clientHeight/h);f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+s+')';f.style.left=(c.clientWidth-w*s)/2+'px';f.style.top=(c.clientHeight-h*s)/2+'px';}}
 addEventListener('resize',fit);fit();
 // Film mode (?film=1): no header, a fresh normal landing, and the pilot flies it all by itself. Press Esc to leave.
 if(/[?&]film=1/.test(location.search)){
   document.body.classList.add('film');document.documentElement.style.setProperty('--navh','0px');fit();
   N1Link.connect('launcher',{},{banner:false}).then(function(l){setTimeout(function(){l.sys('reset',{scenario:'nominal'});l.sys('speed',1);l.sys('autoplay',true);},1500);});
   addEventListener('keydown',function(e){if(e.key==='Escape')location.href='n1.html';});
 }
</script>
<script src="site-nav.js"></script>
</body></html>
