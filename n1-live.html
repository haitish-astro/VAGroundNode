<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live view · Vahnim Ground-N1</title>
<meta name="description" content="Live 3D view of the five-pad Vahnim GroundNode terminal.">
<link rel="stylesheet" href="n1.css"><link rel="stylesheet" href="n1-live.css"><link rel="stylesheet" href="site-nav.css">
</head>
<body class="n1-body live">
<noscript><p style="padding:24px">This demo needs JavaScript.</p></noscript>
<main id="main">
<canvas id="scene" role="img" aria-label="Live 3D view of the five-pad GroundNode terminal"></canvas>
<div id="fallback" class="fallback" hidden>The 3D view needs WebGL, which is not available in this browser. The pilot and ground screens still work.</div>

<div class="hud" id="hud">
  <div class="hud-top">
    <span class="glass chip" id="scenarioTag">Terminal view</span>
    <div class="glass phase-card"><small>VH-101</small><b id="phase">—</b><span class="pill" id="linkPill"><i class="dot" id="linkDot"></i><span id="linkTxt">…</span></span></div>
  </div>
  <div class="caption" id="caption" hidden role="status"></div>
  <div class="hud-bottom">
    <div class="glass telemetry">
      <div><small>Altitude</small><b id="tAlt">—</b></div><div><small>Speed</small><b id="tGs">—</b></div><div><small>Vertical</small><b id="tVs">—</b></div>
      <div><small>Heading</small><b id="tHdg">—</b></div><div><small>Battery</small><b id="tBat">—</b></div><div><small>Pad</small><b id="tPad">—</b></div>
    </div>
    <div class="glass cams" role="group" aria-label="Camera view">
      <button class="btn mini" data-cam="auto" aria-pressed="true"><kbd>1</kbd> Director</button>
      <button class="btn mini" data-cam="chase" aria-pressed="false"><kbd>2</kbd> Chase</button>
      <button class="btn mini" data-cam="pad" aria-pressed="false"><kbd>3</kbd> Pad</button>
      <button class="btn mini" data-cam="tower" aria-pressed="false"><kbd>4</kbd> Tower</button>
      <button class="btn mini" data-cam="orbit" aria-pressed="false"><kbd>5</kbd> Orbit</button>
      <button class="btn mini" data-cam="cockpit" aria-pressed="false"><kbd>6</kbd> Cockpit</button>
      <button class="btn mini ghost" id="hudToggle" title="Hide the panels for a clean picture"><kbd>H</kbd> Clean</button>
    </div>
  </div>
</div>
</main>

<script src="city.js"></script><script src="n1-link.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module" src="n1-live.js"></script>
<script src="site-nav.js"></script>
</body></html>
